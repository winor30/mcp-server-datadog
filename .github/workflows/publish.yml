# Publishes to npm via OIDC trusted publishing (no NPM_TOKEN needed).
# One-time setup on npmjs.com: package -> Settings -> Trusted publishing -> GitHub Actions
#   owner=winor30, repo=mcp-server-datadog, workflow=publish.yml
# Release by bumping the version and pushing a tag like `v1.8.0`.
name: Publish to npm

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Publish
        run: npm publish --access public --ignore-scripts --provenance
